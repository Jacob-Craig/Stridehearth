# A sample Docker Compose file for running a Stridehearth Server (ADR-0009). See docs/self-hosting.md.
#
#   cp .env.example .env    # then set POSTGRES_PASSWORD
#   docker compose pull && docker compose up -d
#
# This is not the repository's root docker-compose.yml, which only starts databases for local development.
services:
  stridehearth:
    # Pinned to an exact image (ADR-0009): a floating tag combined with an auto-updater could apply a One-way Release
    # without anyone choosing to (ADR-0010). No Release has been tagged yet, so this pins the Edge Build by digest.
    # Once one exists, prefer a version: ghcr.io/jacob-craig/stridehearth:X.Y.Z
    image: ghcr.io/jacob-craig/stridehearth@sha256:dab9a1ca49ae3e596046811bd46acba22dea49f0538890f7f201fdf2ef838a47
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      # Required: the image holds no connection settings and refuses to start without these.
      SPRING_DATASOURCE_URL: 'jdbc:postgresql://postgres:5432/${POSTGRES_DB:-stridehearth}'
      SPRING_DATASOURCE_USERNAME: '${POSTGRES_USER:-stridehearth}'
      SPRING_DATASOURCE_PASSWORD: '${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}'
      SPRING_DATA_REDIS_HOST: 'redis'
      # Optional: `closed` (the default) lets only the first account register itself; `open` lets anyone (ADR-0011).
      STRIDEHEARTH_REGISTRATION_MODE: '${STRIDEHEARTH_REGISTRATION_MODE:-closed}'
      # Behind a reverse proxy, uncomment so sign-in limits count each client's address rather than the proxy's.
      # Leave it unset when clients can reach the Server directly. See docs/self-hosting.md.
      # SERVER_FORWARD_HEADERS_STRATEGY: 'native'
    volumes:
      # Import uploads are staged here; the app runs as uid 10001 and writes nowhere else.
      - 'import-temp:/app/temp-batches'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    # Multi-architecture PostGIS build (amd64 and arm64); postgis/postgis publishes only amd64 (ADR-0009).
    image: 'imresamu/postgis:18-3.6'
    restart: unless-stopped
    environment:
      POSTGRES_DB: '${POSTGRES_DB:-stridehearth}'
      POSTGRES_USER: '${POSTGRES_USER:-stridehearth}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}'
    volumes:
      - 'postgres-data:/var/lib/postgresql'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: 'redis:8'
    restart: unless-stopped
    volumes:
      - 'redis-data:/data'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  import-temp:
  postgres-data:
  redis-data:
