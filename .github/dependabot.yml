# Dependabot version updates (ADR-0012).
# Minor and patch bumps are grouped per ecosystem to keep the PR queue short; majors arrive one per PR.
# The cooldown waits a few days after a release before proposing it, so a compromised or
# yanked release has time to be caught upstream first.
version: 2
updates:
  # Workflow actions are pinned to commit SHAs; Dependabot updates the SHA and its version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      gradle-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  # Dockerfiles. /.github/gitleaks pins the CI secret-scanner image.
  # Add "/" here when the release Dockerfile (ADR-0009) lands at the repository root.
  - package-ecosystem: docker
    directories:
      - /.github/gitleaks
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # Images in docker-compose.yml (local development databases).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
